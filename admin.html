<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主持人控制台</title><link rel="stylesheet" href="./style.css"><script src="./config.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script></head><body><main class="shell"><header class="top"><div><div class="eyebrow">主持人控制台</div><h1 class="title">先判断，再调查，再判断</h1><div class="subtitle">控制课堂轮次、投屏二维码，并查看实时结果。</div></div><div id="phaseBadge" class="badge">等待主持人开始</div></header><div class="admin-grid"><section><div class="card"><h2>给同学的参与地址</h2><p class="small">二维码会自动指向当前GitHub Pages网站的参与页。</p><canvas id="qr" class="qr"></canvas><div id="url" class="url"></div><div class="actions"><button id="copy" class="secondary">复制参与地址</button><button id="open" class="secondary">打开参与页</button></div></div><div class="card"><h2>课堂流程</h2><div class="controls"><button class="control" data-action="start">开始第一轮</button><button class="control" data-action="reveal">公开调查信息</button><button class="control" data-action="round2">开始第二轮</button><button class="control" data-action="close">结束互动</button><button class="control danger" data-action="reset">清空并重置</button></div><p class="small">建议：第一轮约12秒；查看结果后公开调查信息；第二轮约10秒；最后比较两轮结果。</p></div></section><section><div class="card"><h2>实时结果</h2><div class="metric-grid"><div class="metric"><span class="small">第一轮参与</span><b id="t1">0</b></div><div class="metric"><span class="small">第二轮参与</span><b id="t2">0</b></div><div class="metric"><span class="small">两轮都参加</span><b id="paired">0</b></div></div><div class="rule"></div><h3>第一轮分布</h3><div id="bars1" class="bars"></div><h3>第二轮分布</h3><div id="bars2" class="bars"></div><div class="rule"></div><h3>两轮判断变化</h3><div id="moves" class="notice">等待第二轮数据。</div></div></section></div></main><script type="module" src="./admin.js"></script></body></html>
